name: CI Satellite Emulator Service

on:
  pull_request:
    branches:
      - main
    paths:
      - "satellite-emulator-service/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-satellite-emulator-service.yaml"
  push:
    branches:
      - main
    paths:
      - "satellite-emulator-service/**"
      - "docker-compose.yml"
      - ".github/workflows/ci-satellite-emulator-service.yaml"
  workflow_call:
    inputs:
      run-static-checks:
        type: boolean
        required: false
        default: true
      run-unit-tests:
        type: boolean
        required: false
        default: true
      run-integration-tests:
        type: boolean
        required: false
        default: true
      run-docker-build:
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      run-static-checks:
        description: "Run static checks"
        type: boolean
        required: false
        default: true
      run-unit-tests:
        description: "Run unit tests"
        type: boolean
        required: false
        default: true
      run-integration-tests:
        description: "Run lightweight integration tests"
        type: boolean
        required: false
        default: true
      run-docker-build:
        description: "Build Docker image"
        type: boolean
        required: false
        default: true

env:
  NODE_VERSION: "22"

jobs:
  satellite-emulator-service:
    name: Satellite Emulator Service
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: satellite-emulator-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-static-checks }}
        run: npm run lint

      - name: Unit tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-unit-tests }}
        run: npm run test:unit

      - name: Integration tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-integration-tests }}
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Docker build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run-docker-build }}
        working-directory: .
        run: docker compose build satellite-emulator-service

